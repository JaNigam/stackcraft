server {
    listen 80;
    root /usr/share/nginx/html;

    # Security headers: the SPA needs nothing from other origins.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;

    client_max_body_size 1m;  # guest progress imports can reach a few hundred KB

    # The browser only ever talks to /api; the runner is not reachable from here.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
