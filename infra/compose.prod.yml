# Production stack for one VM (ADR 0005):
#   docker compose -f infra/compose.prod.yml --env-file infra/.env up -d
# Unlike docker-compose.yml this pulls prebuilt images from Artifact Registry instead of building.
# Only Caddy publishes ports. api, runner and db are on "internal", which has no route to the internet.
name: stackcraft

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep them across restarts or Let's Encrypt rate limits bite
      - caddy_config:/config
    depends_on: [web]
    networks: [edge]

  web:
    image: ${REGISTRY:?set REGISTRY}/web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]

  api:
    image: ${REGISTRY}/api:${TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/stackcraft
      DATABASE_USER: stackcraft
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      STACKCRAFT_RUNNER_URL: http://runner:8091
      STACKCRAFT_WEB_ORIGINS: https://${SITE_ADDRESS}
      STACKCRAFT_AUTH_JWT_PRIVATE_KEY: ${STACKCRAFT_AUTH_JWT_PRIVATE_KEY:?set STACKCRAFT_AUTH_JWT_PRIVATE_KEY}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    depends_on:
      db: { condition: service_healthy }
    networks: [edge, internal]

  runner:
    image: ${REGISTRY}/runner:${TAG:-latest}
    restart: unless-stopped
    environment:
      RUNNER_MAX_CONCURRENT: 1
      RUNNER_QUEUE_CAPACITY: 4
    # Phase 4 (ADR 0005): uncomment once gVisor is installed and verified on the VM.
    # runtime: runsc
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stackcraft
      POSTGRES_USER: stackcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackcraft"]
      interval: 5s
      retries: 10
    networks: [internal]

networks:
  edge: {}
  internal: { internal: true }

volumes:
  dbdata: {}
  caddy_data: {}
  caddy_config: {}
