# Commit before the reveal. Reveals quote code/TrappingRainWater.out or snippets verified by running them.
teasers:
  - id: t1
    prompt: "[5, 0, 5]: how much water is trapped?"
    options: ["0", "5", "10", "2"]
    answer: 1
    reveal: |
      **5**. The middle column has a 5 on each side, so the water there rises to 5, minus its own height 0. The demo
      prints `[5, 0, 5] -> 5`.

  - id: t2
    prompt: "[1, 2, 3, 4] (a staircase going up): how much water?"
    options: ["0", "3", "6", "1"]
    answer: 0
    reveal: |
      **0**. Every column's tallest wall on the left is itself, so water would spill over its left side. A staircase
      (up or down) has no "dip" with walls on both sides. The demo prints `[1, 2, 3, 4] -> 0` and `[4, 3, 2, 1] -> 0`.

  - id: t3
    prompt: "You treat it like Container With Most Water and use only the two end walls as the water level. On [1, 0, 4, 0, 4, 0, 1], what do you get?"
    options: ["6 (correct)", "3", "8", "0"]
    answer: 1
    reveal: |
      **3**, but the right answer is **6**. The end walls are only 1 tall, but between the two 4s the water is 4
      deep. In this problem every bar in between can hold water higher than the ends.

  - id: t4
    prompt: "The left bar is lower than the right bar. Which side's water can you decide right now?"
    options:
      - "The right side, using rightMax"
      - "The left side, using leftMax"
      - "Neither: you need the full prefix arrays"
      - "Both at once"
    answer: 1
    reveal: |
      **The left side.** The right side already has a wall at least as tall as everything that decides the left
      column, so the left column's water is `leftMax - height[left]` regardless of what else is on the right.

  - id: t5
    prompt: "You update leftMax AFTER adding leftMax - h[left], with no special case for a new maximum. What does the example [0,1,0,2,1,0,1,3,2,1,2,1] return?"
    options: ["6", "2", "0", "It throws"]
    answer: 1
    reveal: |
      **2**, not 6. When a bar is taller than the old `leftMax`, `leftMax - h[left]` is **negative**, and those
      negative amounts cancel real water. Update the maximum first (or use the `>=` branch that adds nothing for a
      new maximum).
