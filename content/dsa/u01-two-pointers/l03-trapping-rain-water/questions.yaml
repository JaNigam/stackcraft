# Question bank. Every `predict` program is compiled and run by scripts/verify-content.mjs and must print `expected`.
questions:
  # ---------- Warm-up ----------
  - id: w1
    tier: warmup
    type: mcq
    prompt: How much water sits above column i?
    options:
      - "max(leftMax[i], rightMax[i]) - height[i]"
      - "min(leftMax[i], rightMax[i]) - height[i]"
      - "min(height[i - 1], height[i + 1]) - height[i]"
      - "leftMax[i] + rightMax[i] - 2 * height[i]"
    answer: 1
    explanation: Water spills over the lower of the two tallest walls around the column, so it is the minimum of the two maxima, minus the column itself.

  - id: w2
    tier: warmup
    type: mcq
    prompt: Why is the immediate neighbour formula min(height[i-1], height[i+1]) - height[i] wrong?
    options:
      - "It is right"
      - "Water can be held by walls further away, not just neighbours"
      - "It overflows"
      - "It ignores negative heights"
    answer: 1
    explanation: In [3, 0, 0, 3] each 0 has a 0 neighbour, but both hold 3 units, held by the walls at the ends.

  - id: w3
    tier: warmup
    type: mcq
    prompt: What does the prefix-maxima version cost?
    options: ["O(n²) time, O(1) space", "O(n) time, O(n) space", "O(n) time, O(1) space", "O(n log n) time"]
    answer: 1
    explanation: Two sweeps build leftMax and rightMax (O(n) each, O(n) space), then one pass combines them.

  - id: w4
    tier: warmup
    type: mcq
    prompt: "In the two-pointer version, height[left] < height[right]. What happens next?"
    options:
      - "Settle the right column with rightMax, then right--"
      - "Settle the left column with leftMax, then left++"
      - "Move both pointers"
      - "Swap the two bars"
    answer: 1
    explanation: The lower side can be decided now, because the other side already has a wall at least as tall as this side's max.

  - id: w5
    tier: warmup
    type: mcq
    prompt: Where do the two pointers meet when the loop ends?
    options:
      - "Always in the middle of the array"
      - "At the tallest bar (one of them, if there are ties)"
      - "At the lowest bar"
      - "At index 0"
    answer: 1
    explanation: The pointer on the lower bar always moves, so the tallest bar is never moved past. It holds no water, so stopping there is safe.

  # ---------- Interview ----------
  - id: i1
    tier: interview
    type: predict
    prompt: The prefix-maxima version on a small input. What are the two lines?
    code: |
      import java.util.*;

      public class WaterArray {
          public static void main(String[] args) {
              int[] h = {3, 0, 2, 0, 4};
              int n = h.length;
              int[] leftMax = new int[n], rightMax = new int[n], water = new int[n];
              leftMax[0] = h[0];
              for (int i = 1; i < n; i++) leftMax[i] = Math.max(leftMax[i - 1], h[i]);
              rightMax[n - 1] = h[n - 1];
              for (int i = n - 2; i >= 0; i--) rightMax[i] = Math.max(rightMax[i + 1], h[i]);
              for (int i = 0; i < n; i++) water[i] = Math.min(leftMax[i], rightMax[i]) - h[i];
              System.out.println(Arrays.toString(water));
              System.out.println(Arrays.stream(water).sum());
          }
      }
    expected: |
      [0, 3, 1, 3, 0]
      7
    explanation: Every inner column is bounded by the 3 on the left and the 4 on the right, so the level is 3; 3 - 0, 3 - 2, 3 - 0 gives 3, 1, 3. The ends hold nothing.

  - id: i2
    tier: interview
    type: predict
    prompt: This version only looks at the two end walls, like Container With Most Water. What does it print?
    code: |
      public class ContainerThinking {
          public static void main(String[] args) {
              int[] h = {1, 0, 4, 0, 4, 0, 1};
              // bug: treats it like Container With Most Water (only the two end walls matter)
              int left = 0, right = h.length - 1;
              int level = Math.min(h[left], h[right]);
              int total = 0;
              for (int i = left + 1; i < right; i++) total += Math.max(0, level - h[i]);
              System.out.println(total);
          }
      }
    expected: |
      3
    explanation: The level is stuck at the end walls' 1, so each of the three 0 columns gets 1. The real answer is 6, because the column between the two 4s holds 4.

  - id: i3
    tier: interview
    type: predict
    prompt: This version updates the running max AFTER adding water, with no clamp at zero. What does it print?
    code: |
      public class MaxAfter {
          public static void main(String[] args) {
              int[] h = {0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1};
              int left = 0, right = h.length - 1, leftMax = 0, rightMax = 0, total = 0;
              while (left < right) {
                  if (h[left] < h[right]) {
                      total += leftMax - h[left];          // bug: max updated AFTER, and no clamp at 0
                      leftMax = Math.max(leftMax, h[left]);
                      left++;
                  } else {
                      total += rightMax - h[right];
                      rightMax = Math.max(rightMax, h[right]);
                      right--;
                  }
              }
              System.out.println(total);
          }
      }
    expected: |
      2
    explanation: Each new maximum adds a negative amount (old max minus a taller bar), which cancels real water. The correct answer is 6.

  - id: i4
    tier: interview
    type: short
    prompt: "Explain why the two-pointer version can settle the lower side without knowing the true maximum on the other side."
    modelAnswer: |
      The water at the lower side's column is min(trueLeftMax, trueRightMax) minus its height. Say left is lower.
      trueLeftMax is exactly our running leftMax, since we've seen everything to the left. The right side is
      guaranteed to have a wall at least as tall as leftMax: either the current right bar is taller than the current
      left bar, or leftMax came from a bar we only moved past because a taller bar stood on the right at that time,
      and that bar is still on the right (under the pointer or counted in rightMax). So the minimum is leftMax, and
      the water is leftMax - height[left]. That's why we never need the full right-max array.
    keyPoints:
      - Water = min of the two maxima minus the height
      - The lower side's own running max is exact
      - The other side already has a wall at least that tall
      - So the minimum is known now; O(1) space

  - id: i5
    tier: interview
    type: short
    prompt: Walk the interviewer from brute force to the optimal answer in three steps, with complexity at each step.
    modelAnswer: |
      1. Brute force: for each column, scan left and right for the tallest bars and add min - height. O(n²) time,
         O(1) space.
      2. Prefix maxima: precompute leftMax and rightMax with two sweeps, then one pass to sum. O(n) time, O(n) space.
      3. Two pointers: keep running maxima from both ends and settle whichever side has the lower bar, since the
         other side already has a taller wall. O(n) time, O(1) space.
      I'd code version 2 or 3, keep version 1 as a test oracle, and mention that the input isn't modified.
    keyPoints:
      - Brute force O(n²)
      - Prefix maxima O(n) time, O(n) space
      - Two pointers O(n) time, O(1) space
      - Keep the brute force as a referee

  # ---------- Killer ----------
  - id: k1
    tier: killer
    type: problem
    prompt: "Solve it with a monotonic stack instead. What does the stack hold, and when do you add water?"
    hints:
      - Keep indices of bars in decreasing height order.
      - When a taller bar arrives, the bar you pop is the bottom of a pool; what are its two walls?
      - The water for that layer is (min(left wall, current) - bottom) × (distance between the walls - 1).
    modelAnswer: |
      Keep a stack of indices with decreasing heights. For each bar `i`: while the stack is not empty and `h[i] >
      h[top]`, pop `bottom`. If the stack is now empty there is no left wall, so stop. Otherwise the left wall is the
      new top: add `(min(h[left], h[i]) - h[bottom]) × (i - left - 1)`. Then push `i`. It fills water in horizontal
      layers instead of columns. O(n) time (each index pushed and popped once), O(n) space. It's the version that
      generalises to "next greater element" style problems.

  - id: k2
    tier: killer
    type: problem
    prompt: "Trapping Rain Water II: the heights are a 2D grid. Why do two pointers no longer work, and what replaces them?"
    hints:
      - In 1D the "lower side" was one of two ends. How many sides does a 2D boundary have?
      - Which boundary cell can you settle first, by the same argument as 1D?
      - A min-heap of boundary cells, expanding inward like Dijkstra.
    modelAnswer: |
      In 2D the boundary is a whole ring of cells, not two ends, so "move the lower pointer" becomes "process the
      lowest boundary cell". Put every border cell in a min-heap. Pop the lowest; for each unvisited neighbour, water
      += max(0, popped height - neighbour height), then push the neighbour with height max(its own, popped height)
      and mark it visited. The lowest boundary cell is safe to settle for the same reason as 1D: everything around it
      on the boundary is at least as tall. O(mn log(mn)) time, O(mn) space.

  - id: k3
    tier: killer
    type: problem
    prompt: "The heights arrive as a stream and you must report the total trapped water after each new bar. Which parts of the solution survive?"
    hints:
      - Adding a bar on the right can raise the water level for columns far to the left. Why?
      - Which structure from killer k1 already processes bars left to right?
      - Think about what the running total needs when a new taller bar closes a pool.
    modelAnswer: |
      The two-pointer version needs both ends, so it doesn't stream. The monotonic stack does: it processes bars left
      to right and adds water exactly when a new taller bar closes a pool. Keep the stack and a running total; after
      each new bar, run the pop loop (adding layers) and report the total. Each bar is pushed and popped once, so it
      is amortised O(1) per bar. Water that depends on a future taller bar simply isn't counted until that bar
      arrives, which is the correct answer for the prefix seen so far.

flashcards:
  - id: f1
    front: Water above column i?
    back: min(max to the left incl. i, max to the right incl. i) - h[i]; total = sum over i.
  - id: f2
    front: Three versions and their cost?
    back: Brute force O(n²); prefix maxima O(n) time, O(n) space; two pointers O(n) time, O(1) space.
  - id: f3
    front: Two pointers rule for rain water?
    back: Settle the side with the lower bar using that side's running max, then move it inward.
  - id: f4
    front: Why is settling the lower side safe?
    back: The other side already has a wall at least as tall as this side's max, so this side's max decides.
  - id: f5
    front: Rain Water vs Container With Most Water?
    back: Container picks one pair and ignores walls between; Rain Water sums every column, and walls between hold the water.
  - id: f6
    front: Stack-based approach in one line?
    back: Decreasing stack of indices; when a taller bar comes, pop the bottom and add (min(walls) - bottom) × gap.
