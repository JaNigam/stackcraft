spring:
  application:
    name: stackcraft-runner
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8091}
  # Internal service: bind to loopback by default. Compose overrides with RUNNER_BIND=0.0.0.0 on a private network.
  address: ${RUNNER_BIND:127.0.0.1}

# All limits are overridable by env vars (RUNNER_TIMEOUT, RUNNER_MAX_HEAP_MB, ...). See RunnerProperties.
runner:
  timeout: 10s
  max-heap-mb: 128
  output-cap: 64KB
  max-source: 64KB
  max-concurrent: 2
  queue-capacity: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
