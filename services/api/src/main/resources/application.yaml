spring:
  application:
    name: stackcraft-api
  threads:
    virtual:
      enabled: true
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

# 12-factor: each key maps to an env var, e.g. STACKCRAFT_RUNNER_URL, STACKCRAFT_CONTENT_ROOT, STACKCRAFT_WEB_ORIGINS.
stackcraft:
  content:
    root: ../../content
    reload: false
  runner:
    url: http://127.0.0.1:8091
    read-timeout: 15s
  web-origins: http://localhost:5173
  zone: UTC
  # ADR 0004. STACKCRAFT_AUTH_JWT_PRIVATE_KEY (PKCS#8 PEM) is required in prod; dev generates a throwaway key.
  auth:
    access-ttl: 10m
    refresh-ttl: 30d
    secure-cookies: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

---
# dev: H2 file DB (progress survives restarts), content hot reload.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/stackcraft;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
stackcraft:
  content:
    reload: true

---
# prod: Postgres from env, JSON logs.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stackcraft}
    username: ${DATABASE_USER:stackcraft}
    password: ${DATABASE_PASSWORD:}
stackcraft:
  auth:
    secure-cookies: true
    # No default on purpose: prod refuses to start without a real signing key.
    jwt-private-key: ${STACKCRAFT_AUTH_JWT_PRIVATE_KEY}
logging:
  structured:
    format:
      console: ecs
